<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pr-review-gate</title>
<style>
  :root {
    --bg: #1e1f22;
    --pane: #26282b;
    --border: #38393d;
    --text: #d8dadd;
    --muted: #8b8d92;
    --added: #1f3d2c;
    --added-text: #7fd99a;
    --removed: #3d1f24;
    --removed-text: #e08590;
    --critical: #e05555;
    --warning: #d9a441;
    --suggestion: #6fa8dc;
    --accent: #5b8dee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  header a { color: var(--accent); }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .pane {
    overflow-y: auto;
    padding: 12px;
  }
  #tree-pane { width: 22%; border-right: 1px solid var(--border); }
  #diff-pane { width: 48%; border-right: 1px solid var(--border); font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
  #review-pane { width: 30%; }
  .file-row {
    padding: 5px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1.4;
  }
  .file-row:hover { background: var(--pane); }
  .file-row.active { background: var(--accent); color: #fff; }
  .file-row.related { color: var(--muted); }
  .file-row .reason { display: block; font-size: 11px; opacity: 0.85; }
  .section-label {
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 10px 0 4px;
  }
  .diff-line { white-space: pre; padding: 0 4px; }
  .diff-line.added { background: var(--added); color: var(--added-text); }
  .diff-line.removed { background: var(--removed); color: var(--removed-text); }
  .diff-line.context { color: var(--text); }
  .diff-line.content { color: var(--text); }
  #diff-empty { color: var(--muted); font-size: 13px; }
  .verdict {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .verdict.approve { background: var(--added); color: var(--added-text); }
  .verdict.comment { background: #3a3520; color: var(--warning); }
  .verdict.request-changes { background: var(--removed); color: var(--removed-text); }
  .comment-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .severity {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .severity.critical { color: var(--critical); }
  .severity.warning { color: var(--warning); }
  .severity.suggestion { color: var(--suggestion); }
  .comment-loc { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  ol.checklist { padding-left: 18px; font-size: 12px; }
  ol.checklist li { margin-bottom: 4px; }
  #actions {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  button {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    margin-right: 8px;
  }
  #approve-btn { background: var(--accent); color: #fff; }
  #decline-btn { background: transparent; color: var(--text); border: 1px solid var(--border); }
  #feedback-box { display: none; margin-top: 10px; }
  #feedback-box textarea {
    width: 100%;
    min-height: 60px;
    background: var(--pane);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px;
    font-size: 12px;
  }
  #done-message { font-size: 13px; color: var(--muted); display: none; margin-top: 10px; }
</style>
</head>
<body>
<header>
  PR <span id="pr-number"></span>: <a id="pr-link" target="_blank" rel="noopener"><span id="pr-title"></span></a>
</header>
<main>
  <div class="pane" id="tree-pane"></div>
  <div class="pane" id="diff-pane"><div id="diff-empty">Select a file on the left.</div></div>
  <div class="pane" id="review-pane">
    <div class="section-label">Verdict</div>
    <div id="verdict"></div>
    <div class="section-label">Comments</div>
    <div id="comments"></div>
    <div class="section-label">Manual test checklist</div>
    <ol class="checklist" id="checklist"></ol>
    <div id="actions">
      <button id="approve-btn">Approve</button>
      <button id="decline-btn">Decline</button>
      <div id="feedback-box">
        <textarea id="feedback-text" placeholder="What needs to change?"></textarea>
        <div style="margin-top:8px;">
          <button id="decline-confirm-btn">Send feedback</button>
        </div>
      </div>
      <div id="done-message"></div>
    </div>
  </div>
</main>
<script id="gate-data" type="application/json">__GATE_DATA__</script>
<script>
const data = JSON.parse(document.getElementById('gate-data').textContent);

// Every value below comes from the PR under review or its author, never from this
// tool's own operator. Build every node with createElement + textContent, never
// innerHTML with interpolated data, so a hostile file name or comment body can only
// ever render as text, never execute. The one exception is pr-link.href, gated by an
// explicit http(s)-only scheme check right below.
function textEl(tag, text, className) {
  const el = document.createElement(tag);
  el.textContent = text;
  if (className) { el.className = className; }
  return el;
}

document.getElementById('pr-number').textContent = '#' + data.pr.number;
document.getElementById('pr-title').textContent = data.pr.title;
const prLink = document.getElementById('pr-link');
if (/^https?:\/\//i.test(data.pr.url)) {
  prLink.href = data.pr.url;
} else {
  prLink.removeAttribute('href');
}

const verdictEl = document.getElementById('verdict');
verdictEl.appendChild(textEl('span', data.draft.overall_verdict.replace('-', ' '), 'verdict ' + data.draft.overall_verdict));

const commentsEl = document.getElementById('comments');
if (data.draft.comments.length === 0) {
  const empty = textEl('div', 'No comments.');
  empty.style.color = 'var(--muted)';
  empty.style.fontSize = '12px';
  commentsEl.appendChild(empty);
} else {
  data.draft.comments.forEach(function (comment) {
    const card = document.createElement('div');
    card.className = 'comment-card';
    card.appendChild(textEl('div', comment.severity, 'severity ' + comment.severity));
    card.appendChild(textEl('div', comment.file + ':' + comment.line, 'comment-loc'));
    card.appendChild(textEl('div', comment.text));
    commentsEl.appendChild(card);
  });
}

const checklistEl = document.getElementById('checklist');
data.draft.manual_test_checklist.forEach(function (step) {
  const li = document.createElement('li');
  li.textContent = step;
  checklistEl.appendChild(li);
});

const treeEl = document.getElementById('tree-pane');
function addFileRow(file, isRelated, reason) {
  const row = document.createElement('div');
  row.className = 'file-row' + (isRelated ? ' related' : '');
  row.appendChild(document.createTextNode(file));
  if (reason) {
    row.appendChild(textEl('span', reason, 'reason'));
  }
  row.addEventListener('click', function () {
    document.querySelectorAll('.file-row').forEach(function (r) { r.classList.remove('active'); });
    row.classList.add('active');
    showDiff(file);
  });
  treeEl.appendChild(row);
}

const changed = data.diff.filter(function (entry) { return !entry.is_related; });
const related = data.diff.filter(function (entry) { return entry.is_related; });

const changedLabel = document.createElement('div');
changedLabel.className = 'section-label';
changedLabel.textContent = 'Changed';
treeEl.appendChild(changedLabel);
changed.forEach(function (entry) { addFileRow(entry.file, false, null); });

if (related.length > 0) {
  const relatedLabel = document.createElement('div');
  relatedLabel.className = 'section-label';
  relatedLabel.textContent = 'Related, not edited';
  treeEl.appendChild(relatedLabel);
  related.forEach(function (entry) { addFileRow(entry.file, true, entry.reason); });
}

function showDiff(file) {
  const entry = data.diff.find(function (item) { return item.file === file; });
  const pane = document.getElementById('diff-pane');
  pane.textContent = '';
  if (!entry) {
    pane.appendChild(textEl('div', 'No content for ' + file + '.', null));
    pane.lastChild.id = 'diff-empty';
    return;
  }
  const lines = entry.patch_or_content.split('\n');
  lines.forEach(function (line) {
    const div = document.createElement('div');
    if (entry.is_related) {
      div.className = 'diff-line content';
    } else if (line.startsWith('+') && !line.startsWith('+++')) {
      div.className = 'diff-line added';
    } else if (line.startsWith('-') && !line.startsWith('---')) {
      div.className = 'diff-line removed';
    } else {
      div.className = 'diff-line context';
    }
    div.textContent = line.length === 0 ? ' ' : line;
    pane.appendChild(div);
  });
}

if (changed.length > 0) {
  treeEl.querySelector('.file-row').classList.add('active');
  showDiff(changed[0].file);
}

function sendDecision(payload) {
  fetch('/decision', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  }).then(function () {
    document.getElementById('actions').querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    document.getElementById('feedback-box').style.display = 'none';
    const done = document.getElementById('done-message');
    done.style.display = 'block';
    done.textContent = payload.verdict === 'approve'
      ? 'Approved. You can close this tab.'
      : 'Feedback sent. You can close this tab.';
  });
}

document.getElementById('approve-btn').addEventListener('click', function () {
  sendDecision({ verdict: 'approve', feedback: null });
});
document.getElementById('decline-btn').addEventListener('click', function () {
  document.getElementById('feedback-box').style.display = 'block';
});
document.getElementById('decline-confirm-btn').addEventListener('click', function () {
  const text = document.getElementById('feedback-text').value.trim();
  sendDecision({ verdict: 'decline', feedback: text });
});
</script>
</body>
</html>
