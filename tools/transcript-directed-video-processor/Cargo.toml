[package]
name = "transcript-directed-video-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
genai = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
image = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
