[package]
name = "edit-time-check"
version = "0.1.0"
edition = "2021"

[dependencies]
comment-check = { path = "../comment-check" }
privacy-lint = { path = "../privacy-lint" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
globset = "=0.4.18"
similar = "=2.5.0"
tree-sitter = "=0.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
